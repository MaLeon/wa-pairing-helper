name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/device-name-patch.mjs --check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: wa-pairing-helper
          path: '*.tgz'
